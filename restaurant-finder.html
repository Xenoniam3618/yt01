<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>外れにくい店さがし</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #f2f0eb;
    --text-primary: #1a1916;
    --text-secondary: #5c5a55;
    --text-muted: #9a9891;
    --border: rgba(0,0,0,0.1);
    --border-strong: rgba(0,0,0,0.18);
    --accent: #2563eb;
    --accent-bg: #eff6ff;
    --accent-text: #1d4ed8;
    --success: #16a34a;
    --success-bg: #f0fdf4;
    --success-text: #15803d;
    --warning: #b45309;
    --warning-bg: #fffbeb;
    --warning-text: #92400e;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --radius: 10px;
    --font: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Meiryo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --surface: #1e1c19;
      --surface-2: #272522;
      --text-primary: #f0ede8;
      --text-secondary: #a09d98;
      --text-muted: #6b6865;
      --border: rgba(255,255,255,0.08);
      --border-strong: rgba(255,255,255,0.14);
      --accent-bg: #1e3a5f;
      --accent-text: #93c5fd;
      --success-bg: #14291f;
      --success-text: #6ee7b7;
      --warning-bg: #2a1f0d;
      --warning-text: #fcd34d;
      --danger-bg: #2a1313;
      --danger-text: #fca5a5;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.65;
  }

  header {
    background: var(--surface);
    border-bottom: 0.5px solid var(--border-strong);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo-mark {
    width: 32px; height: 32px;
    background: var(--text-primary);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-mark svg { fill: var(--bg); }
  header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-primary);
  }
  header p {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: auto;
  }

  .container { max-width: 780px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  .search-card {
    background: var(--surface);
    border: 0.5px solid var(--border-strong);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }

  .search-card h2 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 1rem;
  }

  .fields-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media (max-width: 540px) { .fields-grid { grid-template-columns: 1fr; } }

  .field-group { display: flex; flex-direction: column; gap: 5px; }
  .field-group.full { grid-column: 1 / -1; }

  label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
  }

  input[type="text"], select, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 0.5px solid var(--border-strong);
    border-radius: 8px;
    padding: 9px 12px;
    font-size: 14px;
    font-family: var(--font);
    color: var(--text-primary);
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="text"]:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(37,99,235,0.12);
  }
  textarea { min-height: 72px; resize: vertical; }

  .tags-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 12px;
  }
  .tag-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 11px;
    border: 0.5px solid var(--border-strong);
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    background: var(--surface-2);
    color: var(--text-secondary);
    transition: all 0.12s;
    user-select: none;
  }
  .tag-toggle.active {
    background: var(--accent-bg);
    border-color: var(--accent);
    color: var(--accent-text);
    font-weight: 500;
  }
  .tag-toggle input { display: none; }

  .section-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .run-btn {
    width: 100%;
    background: var(--text-primary);
    color: var(--bg);
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-family: var(--font);
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 4px;
  }
  .run-btn:hover { opacity: 0.88; }
  .run-btn:active { transform: scale(0.99); }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #results { margin-top: 1.5rem; }

  .status-msg {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
  }
  .status-msg .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--text-primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result-section { margin-bottom: 1.25rem; }

  .result-header {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    padding: 0 4px;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .result-header::after {
    content: '';
    flex: 1;
    height: 0.5px;
    background: var(--border);
  }

  .restaurant-card {
    background: var(--surface);
    border: 0.5px solid var(--border-strong);
    border-radius: 14px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .restaurant-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
  }
  .restaurant-card.safe::before { background: var(--success); }
  .restaurant-card.local::before { background: var(--accent); }
  .restaurant-card.value::before { background: #7c3aed; }
  .restaurant-card.tourist::before { background: var(--warning); }
  .restaurant-card.caution::before { background: var(--danger); }

  .card-top {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .card-name {
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    line-height: 1.3;
  }
  .card-genre {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .label-badges {
    display: flex; flex-wrap: wrap; gap: 5px;
    flex-shrink: 0;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge-safe { background: var(--success-bg); color: var(--success-text); }
  .badge-local { background: var(--accent-bg); color: var(--accent-text); }
  .badge-value { background: #f5f3ff; color: #5b21b6; }
  @media (prefers-color-scheme: dark) { .badge-value { background: #2e1065; color: #c4b5fd; } }
  .badge-tourist { background: var(--warning-bg); color: var(--warning-text); }
  .badge-caution { background: var(--danger-bg); color: var(--danger-text); }

  .scores-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .score-cell {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 8px 10px;
    text-align: center;
  }
  .score-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 500;
    margin-bottom: 3px;
    letter-spacing: 0.03em;
  }
  .score-val {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .score-val.good { color: var(--success); }
  .score-val.mid { color: var(--warning); }
  .score-val.bad { color: var(--danger); }
  .score-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-top: 5px;
    overflow: hidden;
  }
  .score-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
  .score-fill.good { background: var(--success); }
  .score-fill.mid { background: var(--warning); }
  .score-fill.bad { background: var(--danger); }

  .reason-blocks { display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  .reason-block {
    display: flex; gap: 8px; align-items: flex-start;
    font-size: 13px;
    line-height: 1.5;
  }
  .reason-icon {
    flex-shrink: 0;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    margin-top: 1px;
  }
  .reason-icon.ok { background: var(--success-bg); color: var(--success); }
  .reason-icon.warn { background: var(--warning-bg); color: var(--warning); }
  .reason-icon.ng { background: var(--danger-bg); color: var(--danger); }

  .low-review-summary {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .low-review-summary strong {
    display: block;
    color: var(--text-primary);
    font-size: 12px;
    margin-bottom: 3px;
    font-weight: 600;
  }

  .card-footer {
    display: flex; gap: 8px; align-items: center;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 0.5px solid var(--border);
    flex-wrap: wrap;
  }
  .footer-tag {
    font-size: 11px;
    color: var(--text-muted);
    padding: 2px 7px;
    border: 0.5px solid var(--border);
    border-radius: 4px;
  }
  .walk-tag {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-left: auto;
  }

  .search-links {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-top: 1.5rem;
  }
  .search-links h3 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }
  .link-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .link-chip {
    font-size: 12px;
    padding: 5px 10px;
    background: var(--surface-2);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--text-secondary);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.1s;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .link-chip:hover { background: var(--border); }
  .link-chip svg { opacity: 0.5; }

  .streaming-text {
    white-space: pre-wrap;
    font-size: 14px;
    color: var(--text-secondary);
    line-height: 1.7;
  }

  .parse-error {
    background: var(--warning-bg);
    border: 0.5px solid var(--warning);
    border-radius: 10px;
    padding: 1rem;
    font-size: 14px;
    color: var(--warning-text);
  }

  .about-box {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-top: 2rem;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .about-box strong { color: var(--text-secondary); font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="logo-mark">
    <svg width="18" height="18" viewBox="0 0 18 18">
      <path d="M9 2L3 7v9h4v-5h4v5h4V7L9 2z"/>
    </svg>
  </div>
  <h1>外れにくい店さがし</h1>
  <p>レビュー操作を読み解く</p>
</header>

<div class="container">

  <div class="search-card">
    <h2>検索条件</h2>

    <div class="fields-grid">
      <div class="field-group full">
        <label for="location">旅行先・エリア</label>
        <input type="text" id="location" placeholder="例：京都 祇園、札幌 すすきの、博多駅周辺">
      </div>
      <div class="field-group">
        <label for="time-slot">時間帯</label>
        <select id="time-slot">
          <option value="昼">昼（ランチ）</option>
          <option value="夜">夜（ディナー）</option>
          <option value="どちらでも">どちらでも</option>
        </select>
      </div>
      <div class="field-group">
        <label for="party-size">人数</label>
        <select id="party-size">
          <option value="一人">一人</option>
          <option value="2〜3人">2〜3人</option>
          <option value="4人以上">4人以上</option>
        </select>
      </div>
    </div>

    <div class="section-label">優先したいこと（複数選択可）</div>
    <div class="tags-row" id="priority-tags">
      <label class="tag-toggle"><input type="checkbox" value="地元客が多い"> 地元客が多い</label>
      <label class="tag-toggle"><input type="checkbox" value="価格と質が釣り合っている"> コスパ重視</label>
      <label class="tag-toggle"><input type="checkbox" value="並ばずに入れる"> 並びたくない</label>
      <label class="tag-toggle"><input type="checkbox" value="一人でも入りやすい"> 一人入りやすい</label>
      <label class="tag-toggle"><input type="checkbox" value="観光地名物を食べたい"> 名物を食べたい</label>
      <label class="tag-toggle"><input type="checkbox" value="専門性の高い店"> 専門店</label>
      <label class="tag-toggle"><input type="checkbox" value="長く営業している老舗"> 老舗・長期営業</label>
    </div>

    <div class="section-label" style="margin-top:4px">避けたいこと</div>
    <div class="tags-row" id="avoid-tags">
      <label class="tag-toggle"><input type="checkbox" value="観光客向けの高すぎる店"> 観光客価格</label>
      <label class="tag-toggle"><input type="checkbox" value="メニューが広すぎる総合店"> メニュー広すぎ</label>
      <label class="tag-toggle"><input type="checkbox" value="現金のみの店"> 現金のみNG</label>
      <label class="tag-toggle"><input type="checkbox" value="喫煙可の店"> 喫煙NG</label>
      <label class="tag-toggle"><input type="checkbox" value="コース・飲み放題に誘導する店"> 強制コースNG</label>
    </div>

    <div class="field-group" style="margin-top:12px">
      <label for="extra-notes">その他の条件・ジャンルの希望（任意）</label>
      <textarea id="extra-notes" placeholder="例：海鮮が食べたい、麺類希望、予算は一人2000円以内、アレルギーあり など"></textarea>
    </div>

    <button class="run-btn" id="search-btn" onclick="doSearch()">店を分析して候補を出す</button>
  </div>

  <div id="results"></div>

  <div class="about-box">
    <strong>このシステムについて</strong><br>
    食べログ・Googleマップの点数は、企業への有償評価依頼・レビュー割引・PR記事などで歪みやすいです。このシステムはレビュー点数を信用するのではなく、「低評価の中身」「写真の信頼性」「地元利用の痕跡」「メニューの専門性」「観光地リスク」など複数の軸から外れにくい店を推定します。完全な保証はできませんが、失敗確率を下げる判断材料を提供します。
  </div>

</div>

<script>
const priorityTagsEl = document.getElementById('priority-tags');
const avoidTagsEl = document.getElementById('avoid-tags');

priorityTagsEl.addEventListener('change', e => {
  e.target.closest('.tag-toggle').classList.toggle('active', e.target.checked);
});
avoidTagsEl.addEventListener('change', e => {
  e.target.closest('.tag-toggle').classList.toggle('active', e.target.checked);
});

function getChecked(container) {
  return [...container.querySelectorAll('input:checked')].map(i => i.value);
}

function scoreClass(v) {
  if (v >= 70) return 'good';
  if (v >= 45) return 'mid';
  return 'bad';
}

function renderCard(r) {
  const typeMap = {
    safe: { cls: 'safe', badge: 'badge-safe', label: '外れにくい' },
    local: { cls: 'local', badge: 'badge-local', label: '地元型' },
    value: { cls: 'value', badge: 'badge-value', label: 'コスパ型' },
    tourist_ok: { cls: 'tourist', badge: 'badge-tourist', label: '名物・要注意あり' },
    caution: { cls: 'caution', badge: 'badge-caution', label: '要注意' },
  };
  const t = typeMap[r.type] || typeMap['safe'];

  const okIcon = `<div class="reason-icon ok">✓</div>`;
  const warnIcon = `<div class="reason-icon warn">!</div>`;
  const ngIcon = `<div class="reason-icon ng">✕</div>`;

  const positives = (r.positives || []).map(p =>
    `<div class="reason-block">${okIcon}<span>${p}</span></div>`).join('');
  const cautions = (r.cautions || []).map(c =>
    `<div class="reason-block">${warnIcon}<span>${c}</span></div>`).join('');
  const negatives = (r.negatives || []).map(n =>
    `<div class="reason-block">${ngIcon}<span>${n}</span></div>`).join('');

  const sc = n => scoreClass(n);
  const bar = (v, cls) => `<div class="score-bar"><div class="score-fill ${cls}" style="width:${v}%"></div></div>`;

  const lowReview = r.low_review_analysis
    ? `<div class="low-review-summary"><strong>低評価レビュー分析</strong>${r.low_review_analysis}</div>` : '';

  const footerTags = (r.tags || []).map(t => `<span class="footer-tag">${t}</span>`).join('');
  const walkTag = r.walk_minutes ? `<span class="walk-tag">徒歩約${r.walk_minutes}分圏内</span>` : '';

  const badges = (r.badges || [t.label]).map(b => {
    const badgeCls = b === '外れにくい' ? 'badge-safe'
      : b === '地元型' ? 'badge-local'
      : b === 'コスパ型' ? 'badge-value'
      : b === '要注意' ? 'badge-caution'
      : 'badge-tourist';
    return `<span class="badge ${badgeCls}">${b}</span>`;
  }).join('');

  return `
<div class="restaurant-card ${t.cls}">
  <div class="card-top">
    <div>
      <div class="card-name">${r.name}</div>
      <div class="card-genre">${r.genre || ''} ${r.price_range ? '・' + r.price_range : ''}</div>
    </div>
    <div class="label-badges">${badges}</div>
  </div>
  <div class="scores-row">
    <div class="score-cell">
      <div class="score-label">外れにくさ</div>
      <div class="score-val ${sc(r.score_safety)}">${r.score_safety}</div>
      ${bar(r.score_safety, sc(r.score_safety))}
    </div>
    <div class="score-cell">
      <div class="score-label">価格妥当性</div>
      <div class="score-val ${sc(r.score_value)}">${r.score_value}</div>
      ${bar(r.score_value, sc(r.score_value))}
    </div>
    <div class="score-cell">
      <div class="score-label">地元利用度</div>
      <div class="score-val ${sc(r.score_local)}">${r.score_local}</div>
      ${bar(r.score_local, sc(r.score_local))}
    </div>
  </div>
  <div class="reason-blocks">
    ${positives}${cautions}${negatives}
  </div>
  ${lowReview}
  <div class="card-footer">
    ${footerTags}
    ${walkTag}
  </div>
</div>`;
}

function buildSearchLinks(location) {
  const loc = encodeURIComponent(location);
  const patterns = [
    { label: `${location} 定食 老舗`, q: `${location} 定食 老舗` },
    { label: `${location} 出張 夜ご飯`, q: `${location} 出張 夜ご飯` },
    { label: `${location} 食堂 昼飯`, q: `${location} 食堂 昼飯` },
    { label: `${location} 居酒屋 常連`, q: `${location} 居酒屋 常連` },
    { label: `${location} 一人飯`, q: `${location} 一人飯` },
    { label: `${location} 町中華`, q: `${location} 町中華` },
  ];
  const chips = patterns.map(p => {
    const url = `https://www.google.com/search?q=${encodeURIComponent(p.q)}`;
    return `<a class="link-chip" href="${url}" target="_blank">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M1 1h4v1H2v6h6V5h1v4H1V1zm5 0h3v3H8V2.7L5.35 5.35l-.7-.7L7.3 2H6V1z"/></svg>
      ${p.label}
    </a>`;
  }).join('');

  return `
<div class="search-links">
  <h3>「地元向け」検索のコツ — そのままGoogle検索に使えます</h3>
  <div class="link-chips">${chips}</div>
</div>`;
}

async function doSearch() {
  const location = document.getElementById('location').value.trim();
  if (!location) {
    document.getElementById('location').focus();
    return;
  }
  const timeSlot = document.getElementById('time-slot').value;
  const partySize = document.getElementById('party-size').value;
  const priorities = getChecked(priorityTagsEl);
  const avoids = getChecked(avoidTagsEl);
  const notes = document.getElementById('extra-notes').value.trim();

  const btn = document.getElementById('search-btn');
  btn.disabled = true;
  btn.textContent = '分析中...';

  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = `<div class="status-msg"><div class="spinner"></div><br>レビュー構造を分析しています...</div>`;

  const systemPrompt = `あなたは旅行先の飲食店選びにおける「レビューの歪み補正」の専門家です。
食べログやGoogleマップの点数は企業への有償評価依頼・レビュー割引・PR記事などで歪みやすく、
単純な高評価の店が必ずしも良いとは限りません。

ユーザーの条件を受け取り、指定エリアで「外れにくい」店の候補を5〜7件、
以下のJSON形式で返してください。

重要な評価軸：
1. 低評価レビューの中身（料理への不満 vs 接客・混雑・席への不満）
2. 客の写真の信頼性（公式写真だけか、客撮影が多いか）
3. 地元利用の痕跡（出張記・常連・昼定食がある）
4. メニューの専門性（絞られているか、広すぎないか）
5. 観光地リスク（観光地ど真ん中か、少し外れているか）
6. レビュー投稿の時期集中（不自然なレビュー爆発がないか）
7. PR記事比率（検索すると宣伝記事ばかりか）

レスポンスは必ず以下のJSON配列のみ返してください（```や説明文は不要）:
[
  {
    "name": "店名（架空でOK、イメージとして）",
    "genre": "ジャンル",
    "price_range": "〜1000円 / 〜2000円 / 〜3000円 / 3000円〜 のいずれか",
    "type": "safe | local | value | tourist_ok | caution のいずれか",
    "badges": ["外れにくい", "地元型"] などラベルの配列（1〜2個）,
    "score_safety": 0〜100の整数（外れにくさ）,
    "score_value": 0〜100の整数（価格妥当性）,
    "score_local": 0〜100の整数（地元利用度）,
    "positives": ["このエリアらしい説明（良い点、2〜4個）"],
    "cautions": ["注意点（1〜2個、なければ省略）"],
    "negatives": ["明確な懸念（cautionタイプのみ、1〜2個）"],
    "low_review_analysis": "低評価レビューの内容分析（1〜2文）",
    "tags": ["老舗", "専門店", "出張族に人気" などのタグ、2〜4個],
    "walk_minutes": 観光地中心部からの徒歩分数（整数、推定でOK）
  }
]

注意：
- nameはそのエリアの実在しそうな雰囲気の店名にする（ただし架空でよい）
- スコアは正直に。caution店はscore_safetyを低くする
- positives/cautionsは具体的に（「低評価が接客中心で料理への不満が少ない」等）
- 観光地ど真ん中の高すぎる店も「tourist_ok」または「caution」として含め、比較できるようにする`;

  const userMsg = `エリア：${location}
時間帯：${timeSlot}
人数：${partySize}
${priorities.length ? '優先したいこと：' + priorities.join('、') : ''}
${avoids.length ? '避けたいこと：' + avoids.join('、') : ''}
${notes ? 'その他：' + notes : ''}

上記条件で、外れにくい店の候補をJSON形式で返してください。`;

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: 'user', content: userMsg }]
      })
    });

    const data = await resp.json();
    const raw = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('');

    let restaurants;
    try {
      const cleaned = raw.replace(/```json|```/g, '').trim();
      restaurants = JSON.parse(cleaned);
    } catch (e) {
      resultsEl.innerHTML = `
        <div class="parse-error">分析結果の解析中にエラーが発生しました。もう一度試してください。</div>
        <div class="status-msg" style="margin-top:10px;text-align:left;padding:1rem">
          <div class="streaming-text">${raw}</div>
        </div>`;
      btn.disabled = false;
      btn.textContent = '店を分析して候補を出す';
      return;
    }

    const safe = restaurants.filter(r => r.type === 'safe' || r.type === 'local' || r.type === 'value');
    const tourists = restaurants.filter(r => r.type === 'tourist_ok');
    const cautions = restaurants.filter(r => r.type === 'caution');

    let html = '';

    if (safe.length) {
      html += `<div class="result-section"><div class="result-header">外れにくい候補</div>`;
      html += safe.map(renderCard).join('');
      html += `</div>`;
    }
    if (tourists.length) {
      html += `<div class="result-section"><div class="result-header">名物・観光向け（条件付きで可）</div>`;
      html += tourists.map(renderCard).join('');
      html += `</div>`;
    }
    if (cautions.length) {
      html += `<div class="result-section"><div class="result-header">要注意（比較参考）</div>`;
      html += cautions.map(renderCard).join('');
      html += `</div>`;
    }

    html += buildSearchLinks(location);

    resultsEl.innerHTML = html;

  } catch (err) {
    resultsEl.innerHTML = `<div class="status-msg">エラーが発生しました：${err.message}</div>`;
  }

  btn.disabled = false;
  btn.textContent = '店を分析して候補を出す';
}

document.getElementById('location').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
</html>
